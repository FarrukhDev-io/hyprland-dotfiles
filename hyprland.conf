# ==============================================================================
# HYPRLAND ORCHESTRATOR (Component-Driven Architecture)
# ==============================================================================

# 1. Environment & Variables (Must load first)
source = ~/.config/hypr/configs/envs.conf

# 2. Monitors & Workspaces
source = ~/.config/hypr/configs/monitors.conf

# 3. Autostart Daemons
source = ~/.config/hypr/configs/autostart.conf

# 4. Look & Feel (General, Decorations, Input)
source = ~/.config/hypr/configs/look_feel.conf

# 5. Animations
source = ~/.config/hypr/configs/animations.conf

# 6. Window Rules & Layer Rules
source = ~/.config/hypr/configs/windowrules.conf

# 7. Keybindings (Depends on $mainMod and variables)
source = ~/.config/hypr/configs/keybinds.conf
