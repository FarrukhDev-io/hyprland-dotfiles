# ==============================================================================
# MODULE: LOOK & FEEL
# RESPONSIBILITY: General styling, gaps, borders, layout, active/inactive colors
# ==============================================================================

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
    }
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        ignore_opacity = true
        xray = false
        special = true
    }
    shadow {
        enabled = true
        range = 8
        render_power = 2
        color = rgba(1a1a2eee)
    }
}

dwindle {
    preserve_split = true
    force_split = 2
}

master {
    mfact = 0.55
    new_status = master
    orientation = center
}

gestures {
    # Default gestures
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 0
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    enable_swallow = false
    initial_workspace_tracking = 1
}

cursor {
    inactive_timeout = 3
}
