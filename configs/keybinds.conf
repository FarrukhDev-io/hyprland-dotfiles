# ==============================================================================
# MODULE: KEYBINDS
# RESPONSIBILITY: Main keybinds, media keys, window control bindings, submaps
# ==============================================================================
$mainMod = SUPER
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Space, exec, $menu
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, rofi -show run
bind = $mainMod, W, exec, sh -c 'google-chrome-stable 2>/dev/null || firefox 2>/dev/null || thunar'
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, Q, exec, wlogout -b 5
bind = $mainMod CTRL, Q, exec, hyprctl kill
bind = $mainMod, V, exec, $clipboard
bind = $mainMod SHIFT, V, exec, cliphist wipe
bind = , Print, exec, grim - | wl-copy
bind = SHIFT, Print, exec, grim ~/Pictures/Screenshots/screenshot_$(date +%Y%m%d_%H%M%S).png
bind = $mainMod, Print, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod SHIFT, Print, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/screenshot_$(date +%Y%m%d_%H%M%S).png
bind = CTRL, Print, exec, grim -g "$(slurp -d)" - | wl-copy
bind = $mainMod CTRL, R, exec, wf-recorder -f ~/Videos/recordings/recording_$(date +%Y%m%d_%H%M%S).mp4
bind = $mainMod CTRL SHIFT, R, exec, killall wf-recorder
bind = $mainMod, C, exec, hyprpicker -a
bind = $mainMod, L, exec, hyprlock
bind = $mainMod SHIFT, L, exec, hyprctl dispatch dpms off
bind = $mainMod CTRL, L, exec, loginctl lock-session
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, togglefloating
bind = $mainMod, P, pseudo
bind = $mainMod, T, togglegroup
bind = $mainMod SHIFT, T, lockactivegroup, toggle
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod ALT, left, swapwindow, l
bind = $mainMod ALT, right, swapwindow, r
bind = $mainMod ALT, up, swapwindow, u
bind = $mainMod ALT, down, swapwindow, d
binde = $mainMod CTRL, right, resizeactive, 30 0
binde = $mainMod CTRL, left, resizeactive, -30 0
binde = $mainMod CTRL, up, resizeactive, 0 -30
binde = $mainMod CTRL, down, resizeactive, 0 30
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod, S, togglespecialworkspace
bind = $mainMod SHIFT, S, movetoworkspace, special
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
binde = , XF86AudioRaiseVolume, exec, pamixer -i 5
binde = , XF86AudioLowerVolume, exec, pamixer -d 5
bind = , XF86AudioMute, exec, pamixer -t
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl pause
bind = , XF86AudioStop, exec, playerctl stop
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioMicMute, exec, pamixer --default-source -t
binde = , XF86MonBrightnessUp, exec, brightnessctl set +5%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
binde = , XF86KbdBrightnessUp, exec, brightnessctl -d *::kbd_backlight set +10%
binde = , XF86KbdBrightnessDown, exec, brightnessctl -d *::kbd_backlight set 10%-
bind = $mainMod, D, exec, wofi --show drun
bind = $mainMod, A, exec, rofi -show run
bind = $mainMod, O, exec, rofi -show window
bind = $mainMod SHIFT, E, exec, thunar ~/Pictures/Screenshots
bind = $mainMod, M, exec, ml4w-dotfiles-settings com.ml4w.dotfiles
bind = $mainMod SHIFT, W, exec, ~/.config/ml4w/scripts/ml4w-wallpaper
bind = $mainMod CTRL, W, exec, ~/.config/ml4w/scripts/ml4w-wallpaper-effects
bind = $mainMod, B, exec, ~/.config/waybar/launch.sh
bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,
bind = ALT SHIFT, Tab, cyclenext, prev
bind = ALT SHIFT, Tab, bringactivetotop,
